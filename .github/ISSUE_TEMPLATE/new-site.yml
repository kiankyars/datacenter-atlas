name: Suggest a new site
description: Suggest a data centre at any stage, from announcement to operation.
title: "New site: "
labels:
  - new-site
body:
  - type: markdown
    attributes:
      value: |
        Please include public sources for the project's status and location. See the
        [selection rules](https://kiankyars.github.io/datacenter-atlas/methodology/#selection).

        - **Dated status evidence.** A primary source identifies the project and supports its
          announcement, permit, construction, completion or operation. New sites need evidence
          dated within 90 days before the data update. Permitted status requires issued consent
          for the data-centre development itself, with the approved work identified. Utility,
          microgrid or air permits alone are insufficient. Planned opening dates do not establish
          completion or operation.
        - **A precise locator.** An official parcel or boundary, an official address point, a
          coordinate published by the developer or a public authority, or a named map feature. A
          city centre, head-office address or industrial-zone centroid is not enough.
        - **A new physical site.** Another phase or building on a campus that is already listed
          does not add a site. Please search the
          [site list](https://kiankyars.github.io/datacenter-atlas/sites/) first.
        - **Later reports.** Include later changes in status. Sites stay listed when they open,
          pause, close or change status.
  - type: input
    id: name
    attributes:
      label: Site or project name
      placeholder: Example Data Centre Campus, Building 2
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: >-
        Country, city and the most precise location you have: street address, parcel or lot
        number, or coordinates together with where they come from.
    validations:
      required: true
  - type: input
    id: operator
    attributes:
      label: Operator or developer
      description: Who develops or operates the site, or plans to, according to a source.
    validations:
      required: false
  - type: input
    id: status_evidence_url
    attributes:
      label: Status evidence URL
      description: >-
        A primary public source (company disclosure, government record, regulatory filing)
        supporting the named project's announcement, permit, construction, completion or operation.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: status_evidence_date
    attributes:
      label: Status evidence date
      description: >-
        The date the evidence applies to. If the source gives only a month, say so without
        inventing a day. A later page edit or retrieval date does not count.
      placeholder: YYYY-MM-DD, or YYYY-MM if only a month is known
    validations:
      required: true
  - type: textarea
    id: locator_evidence
    attributes:
      label: Locator evidence
      description: >-
        URL of the source that places the project at a parcel, boundary, address point or
        coordinate, and what exactly it locates: the building, the project or the whole campus.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Other phases on the same campus, aliases, capacity statements with their exact wording
        and scope, the permit authority and approved work, later status reports, or reasons the site might already be
        listed under another name.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the site list and this physical site is not already in the atlas.
          required: true
        - label: The evidence is publicly accessible, and I have not included confidential documents or personal data.
          required: true
