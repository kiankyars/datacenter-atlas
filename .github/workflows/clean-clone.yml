name: Clean-clone checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: datacenter_atlas
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - name: Check dependency lock
        working-directory: datacenter_atlas
        run: uv lock --check
      - name: Install the standard-library core
        working-directory: datacenter_atlas
        run: uv sync --locked --no-default-groups --python 3.12
      - name: Run corpus-free tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
            datacenter_atlas/.venv/bin/python -m unittest -v \
            datacenter_atlas.tests.test_models \
            datacenter_atlas.tests.test_database \
            datacenter_atlas.tests.test_timestamp_boundaries \
            datacenter_atlas.tests.test_release \
            datacenter_atlas.tests.test_recovered_legacy_evidence \
            datacenter_atlas.tests.test_verified_construction_core \
            datacenter_atlas.tests.test_verified_construction_core_v012 \
            datacenter_atlas.tests.test_verified_construction_core_v013 \
            datacenter_atlas.tests.test_verified_construction_core_v014 \
            datacenter_atlas.tests.test_verified_construction_core_v015 \
            datacenter_atlas.tests.test_verified_construction_core_v016 \
            datacenter_atlas.tests.test_verified_construction_core_v017 \
            datacenter_atlas.tests.test_expansion_200_inventory \
            datacenter_atlas.tests.test_expansion_200_sources \
            datacenter_atlas.tests.test_verified_construction_core_v018 \
            datacenter_atlas.tests.test_expansion_200_draft \
            datacenter_atlas.tests.test_expansion_200_finland \
            datacenter_atlas.tests.test_expansion_200_second_reviewed \
            datacenter_atlas.tests.test_expansion_200_third_reviewed \
            datacenter_atlas.tests.test_expansion_200_fourth_reviewed \
            datacenter_atlas.tests.test_expansion_200_fifth_reviewed \
            datacenter_atlas.tests.test_expansion_200_sixth_reviewed \
            datacenter_atlas.tests.test_expansion_200_seventh_reviewed \
            datacenter_atlas.tests.test_expansion_200_eighth_reviewed \
            datacenter_atlas.tests.test_workspace_shim
      - name: Validate the frozen expansion research inventory
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_inventory.py --validate-snapshot
      - name: Smoke-test the CLI
        run: .venv/bin/python scripts/build_expansion_200_draft.py --help
        working-directory: datacenter_atlas
      - name: Validate the reviewed initial-three draft
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --validate-only
      - name: Smoke-test the public CLI
        run: datacenter_atlas/.venv/bin/python -m datacenter_atlas --help
      - name: Validate the cumulative-five draft
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --batch initial-five --validate-only
      - name: Validate the second reviewed checkpoint
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --batch second-reviewed --validate-only
      - name: Validate the third reviewed checkpoint
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --batch third-reviewed --validate-only
      - name: Validate the fourth reviewed checkpoint
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --batch fourth-reviewed --validate-only
      - name: Validate the fifth reviewed checkpoint
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --batch fifth-reviewed --validate-only
      - name: Validate thirty-eight-site reviewed expansion draft
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --batch sixth-reviewed --validate-only
      - name: Validate forty-site reviewed expansion draft
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --batch seventh-reviewed --validate-only
      - name: Validate forty-three-site reviewed expansion draft
        working-directory: datacenter_atlas
        run: .venv/bin/python scripts/build_expansion_200_draft.py --batch eighth-reviewed --validate-only
      - name: Lint the clean-clone surface
        working-directory: datacenter_atlas
        run: |
          uv run --locked --only-group lint ruff check \
            datacenter_atlas/models.py \
            datacenter_atlas/database.py \
            datacenter_atlas/repository.py \
            datacenter_atlas/release.py \
            datacenter_atlas/timestamps.py \
            datacenter_atlas/verified_construction_core.py \
            datacenter_atlas/verified_construction_core_v017.py \
            datacenter_atlas/verified_construction_core_v018.py \
            datacenter_atlas/expansion_200_initial_three.py \
            datacenter_atlas/expansion_200_initial_five.py \
            datacenter_atlas/expansion_200_second_reviewed.py \
            datacenter_atlas/expansion_200_third_reviewed.py \
            datacenter_atlas/expansion_200_fourth_reviewed.py \
            datacenter_atlas/expansion_200_fifth_reviewed.py \
            datacenter_atlas/expansion_200_sixth_reviewed.py \
            datacenter_atlas/expansion_200_seventh_reviewed.py \
            datacenter_atlas/expansion_200_eighth_reviewed.py \
            europe_latam_official_discovery_20260721.py \
            scripts/build_verified_construction_core.py \
            scripts/generate_verified_construction_core_v017_inputs.py \
            scripts/build_expansion_200_inventory.py \
            scripts/build_expansion_200_draft.py \
            tests/test_models.py \
            tests/test_database.py \
            tests/test_timestamp_boundaries.py \
            tests/test_release.py \
            tests/test_recovered_legacy_evidence.py \
            tests/test_verified_construction_core.py \
            tests/test_verified_construction_core_v012.py \
            tests/test_verified_construction_core_v013.py \
            tests/test_verified_construction_core_v014.py \
            tests/test_verified_construction_core_v015.py \
            tests/test_verified_construction_core_v016.py \
            tests/test_verified_construction_core_v017.py \
            tests/test_expansion_200_inventory.py \
            tests/test_expansion_200_sources.py \
            tests/test_verified_construction_core_v018.py \
            tests/test_expansion_200_draft.py \
            tests/test_expansion_200_finland.py \
            tests/test_expansion_200_second_reviewed.py \
            tests/test_expansion_200_third_reviewed.py \
            tests/test_expansion_200_fourth_reviewed.py \
            tests/test_expansion_200_fifth_reviewed.py \
            tests/test_expansion_200_sixth_reviewed.py \
            tests/test_expansion_200_seventh_reviewed.py \
            tests/test_expansion_200_eighth_reviewed.py \
            tests/test_workspace_shim.py
