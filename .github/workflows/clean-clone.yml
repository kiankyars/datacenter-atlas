name: Clean-clone checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (the comment names the release), and the checkout
      # does not keep the token in .git/config while the tests run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: datacenter_atlas
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.4"
      - name: Check dependency lock
        working-directory: datacenter_atlas
        run: uv lock --check
      - name: Install the standard-library core
        working-directory: datacenter_atlas
        run: uv sync --locked --no-default-groups --python 3.12
      - name: Run corpus-free tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
            datacenter_atlas/.venv/bin/python -m unittest -v \
            datacenter_atlas.tests.test_models \
            datacenter_atlas.tests.test_database \
            datacenter_atlas.tests.test_timestamp_boundaries \
            datacenter_atlas.tests.test_release \
