name: Public site

# Builds the static site (HTML, JSON API, downloads) from the tracked datasets, checks the
# hand-written dataset facts against it, runs its unit, JavaScript and browser tests against the
# build served the way GitHub Pages serves it (under /datacenter-atlas/, with no directory
# listings), deploys it to GitHub Pages on pushes to main and then checks the live site. With the
# repository variable ATLAS_GITHUB_RELEASES set to "true", each new dataset version also gets a
# GitHub Release with its files attached. A weekly run re-checks the live site and reports dead
# evidence links in an issue labelled "link-rot".
#
# Every action is pinned to a full commit SHA (the comment names its release), so a moved tag
# cannot change what builds or deploys the site. To update one, resolve the new release's commit
# with `gh api repos/<owner>/<action>/git/ref/tags/<tag>` and replace both the SHA and the comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: "build: build and test (deploys only on pushes); monitor: check the live site and its evidence links"
        type: choice
        options: [build, monitor]
        default: build
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC: the live-site monitor only

permissions:
  contents: read

concurrency:
  # One run at a time per ref. A newer push to a pull request cancels its older run; runs on main
  # are never cancelled, and the deploy job serialises deployments in the "pages" group. Monitor
  # runs have their own group, so a scheduled run can never displace a pending deploy.
  group: public-site-${{ github.ref }}${{ (github.event_name == 'schedule' || inputs.job == 'monitor') && '-monitor' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: https://kiankyars.github.io/datacenter-atlas/

jobs:
  build:
    if: github.event_name != 'schedule' && inputs.job != 'monitor'
    # Pinned instead of ubuntu-latest so the image, and the system packages that
    # `playwright install --with-deps` adds to it, change only when this file does.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: datacenter_atlas
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The builder and its unit tests are standard-library only: no install step is needed.
      - name: Build the public site
        run: >-
          python datacenter_atlas/scripts/build_public_site.py
          --output _site
          --base-url "$SITE_URL"
          --source-commit "$GITHUB_SHA"
      - name: Check README.md, CITATION.cff and DATA_LICENSE.md against the build
        # Fails when a hand-written dataset fact (version, counts, gates, citation) is stale; the
        # message says how to regenerate them (docs/public_site.md, "Making a new checkpoint current").
        run: python datacenter_atlas/site/e2e/check_public_metadata.py --site _site --repo datacenter_atlas
      - name: Run the public-site unit tests
        run: python -m unittest -v datacenter_atlas.tests.test_public_site
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Run the JavaScript unit tests
        run: |
          # An explicit file list: Node 22 treats --test arguments as glob patterns, not directories.
          # The frontend ships these tests, so finding none means they were not committed (the
          # default-deny .gitignore must whitelist site/**/*.mjs); fail instead of skipping silently.
          js_tests=()
          while IFS= read -r test_file; do
            js_tests+=("$test_file")
          done < <(
            find datacenter_atlas/site/js-tests -type f \
              \( -name '*.test.mjs' -o -name '*.test.js' -o -name '*.test.cjs' \) 2>/dev/null | LC_ALL=C sort
          )
          if [ "${#js_tests[@]}" -eq 0 ]; then
            echo "::error::no *.test.mjs files in site/js-tests; check that .gitignore tracks site/**/*.mjs"
            exit 1
          fi
          node --test "${js_tests[@]}"
      # The Pages artifact is captured before any third-party browser tooling is installed, so
      # nothing the browser tests download can alter what gets deployed. The deploy job still
      # waits for this whole job, browser tests included, to pass.
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Compare the Pages URL with the built base URL
        if: steps.pages.outcome == 'success'
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "${PAGES_BASE_URL%/}/" != "$SITE_URL" ]; then
            echo "::warning::GitHub Pages serves ${PAGES_BASE_URL} but the site was built for $SITE_URL; update SITE_URL here and base_url in site/config.json."
          fi
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # This action uploads through actions/upload-artifact@v4, a tag it pins itself.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Install the browser-test tooling
        timeout-minutes: 10
        run: |
          python -m pip install --require-hashes --only-binary :all: \
            -r datacenter_atlas/site/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run the browser tests against the site served like GitHub Pages
        timeout-minutes: 20
        env:
          ATLAS_BASE_URL: http://127.0.0.1:8000/datacenter-atlas/
          ATLAS_E2E_REQUIRED: "1"
          ATLAS_SCREENSHOT_DIR: site-screenshots
        run: |
          # pages_server.py serves _site under /datacenter-atlas/ with GitHub Pages' rules: a
          # directory answers with its index.html or index.json, never with a listing, and a
          # missing path gets 404.html with status 404.
          python datacenter_atlas/site/e2e/pages_server.py --directory _site --port 8000 --verbose \
            > http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --fail --max-time 5 --output /dev/null "${ATLAS_BASE_URL}api/v1/index.json"; then
              break
            fi
            if [ "$attempt" -eq 50 ]; then
              echo "::error::the local web server did not start"
              cat http-server.log
              exit 1
            fi
            sleep 0.2
          done
          python -m pytest datacenter_atlas/site/e2e -q -rs -p no:cacheprovider --durations=10
      - name: Show the end of the web server log
        if: failure()
        run: tail -n 200 http-server.log || true
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-screenshots
          path: site-screenshots/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write # create the Pages deployment
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    # The deployment API reports success before every CDN edge serves the new files; this job
    # waits until the live API reports this commit, then checks what users and scripts rely on.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: datacenter_atlas
          persist-credentials: false
          sparse-checkout: site/e2e
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the live site
        run: >-
          python datacenter_atlas/site/e2e/live_checks.py
          --base-url "$SITE_URL"
          --wait-for-commit "$GITHUB_SHA"
          --timeout 600
          --summary "$GITHUB_STEP_SUMMARY"

  release:
    # Opt-in: set the repository variable ATLAS_GITHUB_RELEASES to "true" (Settings, Secrets and
    # variables, Actions, Variables). Creates the release data-<dataset id> once per dataset
    # version, from the exact files that were deployed; later pushes for the same version skip it.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.ATLAS_GITHUB_RELEASES == 'true'
    needs: verify-live
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: datacenter_atlas
          persist-credentials: false
          sparse-checkout: site/e2e
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download the deployed site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: pages-artifact
      - name: Create the release for a new dataset version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir site
          tar -xf pages-artifact/artifact.tar -C site
          python datacenter_atlas/site/e2e/release_notes.py \
            --site site --notes notes.md --assets assets.txt --commit "$GITHUB_SHA" > release.txt
          tag=$(sed -n 1p release.txt)
          title=$(sed -n 2p release.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          mapfile -t assets < assets.txt
          gh release create "$tag" "${assets[@]}" \
            --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          echo "Created release $tag with ${#assets[@]} files." >> "$GITHUB_STEP_SUMMARY"

  monitor:
    # Weekly (and on manual dispatch with job=monitor): re-check the live site and every evidence
    # source URL. Dead links are listed in one open issue labelled "link-rot", which is updated
    # each week and closed when none remain. Link results never fail the run; live-site problems do.
    if: github.event_name == 'schedule' || inputs.job == 'monitor'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # open, update or close the link-rot issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: datacenter_atlas
          persist-credentials: false
          sparse-checkout: site/e2e
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the live site and the evidence links
        id: check
        run: |
          status=0
          python datacenter_atlas/site/e2e/live_checks.py --base-url "$SITE_URL" \
            --check-links --report link-report.md --summary "$GITHUB_STEP_SUMMARY" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Update the link-rot issue
        if: always() && hashFiles('link-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if grep -q '^### Dead' link-report.md; then has_dead=1; else has_dead=0; fi
          gh label create link-rot --color B60205 \
            --description "Evidence source links that no longer resolve" --force > /dev/null
          issue=$(gh issue list --label link-rot --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$has_dead" -eq 1 ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file link-report.md
            else
              gh issue create --title "Dead evidence links" --label link-rot --body-file link-report.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "No dead evidence links in the check of $(date -u +%F)."
          fi
      - name: Upload the link report
        if: always() && hashFiles('link-report.md') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-report
          path: link-report.md
          retention-days: 30
      - name: Fail when the live site has problems
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::the live site check failed (see the job summary)"
          exit 1
