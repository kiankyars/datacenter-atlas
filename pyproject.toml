[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacenter-atlas"
version = "0.1.0"
description = "A provenance-first registry for global data-centre construction evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = [
    "pytest==8.4.2",
]
imagery-test = [
    "numpy==2.5.1; python_version >= '3.12'",
    "pillow==12.3.0; python_version >= '3.12'",
    "rasterio==1.5.0; python_version >= '3.12'",
]
lint = [
    "ruff==0.16.0",
]

[project.scripts]
datacenter-atlas = "datacenter_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datacenter_atlas*"]

[tool.setuptools.package-data]
datacenter_atlas = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
